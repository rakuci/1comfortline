name: SEO and indexing integrity

on:
  push:
    branches:
      - fix/seo-indexing-oct-2026
  pull_request:
    paths:
      - "artifacts/comfortline-website/**"
      - "scripts/check-seo-indexing.mjs"
      - ".github/workflows/seo-indexing-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Node source syntax
        run: |
          node --check artifacts/comfortline-website/server.mjs
          node --check scripts/check-seo-indexing.mjs
      - name: Check sitemap, canonical paths and route guidance
        run: node scripts/check-seo-indexing.mjs

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "3000"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript project references
        run: pnpm run typecheck:libs
      - name: Typecheck website
        run: pnpm --filter @workspace/comfortline-website run typecheck
      - name: Build and prerender website
        run: pnpm --filter @workspace/comfortline-website run build
